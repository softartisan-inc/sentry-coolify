name: build-images

# Publie les 9 images sur ghcr.io/softartisan-inc.
# Declenchement : push sur main, ou manuellement pour changer de version
# upstream sans toucher au code.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "overlays/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      self_hosted_version:
        description: "Version de getsentry/self-hosted (ex. 26.8.0)"
        required: true
        default: "26.8.0"

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NAMESPACE: softartisan-inc
  DEFAULT_VERSION: "26.8.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: sentry
            image: sentry-sa
          - target: sentry-cleanup
            image: sentry-cleanup-sa
          - target: snuba
            image: snuba-sa
          - target: clickhouse
            image: clickhouse-sa
          - target: nginx
            image: nginx-sa
          - target: relay
            image: relay-sa
          - target: symbolicator
            image: symbolicator-sa
          - target: taskbroker
            image: taskbroker-sa
          - target: valkey
            image: valkey-sa

    steps:
      - uses: actions/checkout@v4

      - name: Resoudre la version upstream
        id: version
        run: |
          version="${{ inputs.self_hosted_version || env.DEFAULT_VERSION }}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # Les images amont Sentry ne sont publiees qu'en amd64 : ne pas
          # tenter arm64 ici, le build echouerait sur les stages derives.
          platforms: linux/amd64
          provenance: false
          build-args: |
            SELF_HOSTED_VERSION=${{ steps.version.outputs.value }}
            SENTRY_IMAGE=ghcr.io/getsentry/sentry:${{ steps.version.outputs.value }}
            SNUBA_IMAGE=ghcr.io/getsentry/snuba:${{ steps.version.outputs.value }}
            RELAY_IMAGE=ghcr.io/getsentry/relay:${{ steps.version.outputs.value }}
            SYMBOLICATOR_IMAGE=ghcr.io/getsentry/symbolicator:${{ steps.version.outputs.value }}
            TASKBROKER_IMAGE=ghcr.io/getsentry/taskbroker:${{ steps.version.outputs.value }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier que le compose est valide
        run: |
          cp .env.example .env
          # Valeurs factices : on ne teste que la syntaxe et la resolution
          # des ancres, pas le demarrage.
          echo "SERVICE_PASSWORD_64_SENTRYSECRET=ci-placeholder" >> .env
          docker compose config --quiet
          docker compose -f sentry.yaml config --quiet
          echo "OK — $(docker compose config --services | wc -l) services"
